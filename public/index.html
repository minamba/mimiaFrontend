<!DOCTYPE html>
<html lang="fr">
  <head>
    <!-- SOMBRE PAR DÉFAUT, POSÉ AVANT LA MOINDRE FEUILLE DE STYLE.
         Mimia ne suit plus les réglages du système : le sombre est le thème
         par défaut du produit, et seul un choix explicite enregistré dans
         « Mes paramètres » (src/lib/storage/theme.js) fait basculer en clair.
         Ce script tourne AVANT le CSS pour poser l'attribut dont il dépend —
         sans lui, un parent qui a choisi le clair verrait un flash de sombre
         à chaque chargement, le temps que React démarre. -->
    <!-- LE STYLE « BLUE SKY », POSÉ AU MÊME MOMENT ET POUR LA MÊME RAISON.
         C'est l'administration qui le décide (réglage BLUE_SKY), mais la
         réponse du serveur arrive après le premier affichage : sans cette
         mémoire de l'appareil (src/lib/storage/styleSite.js), chaque
         chargement montrerait l'ancien style une fraction de seconde. Blue Sky
         impose le sombre : ses couleurs sont faites pour le bleu de marque. -->
    <script>
      (function () {
        var theme = 'dark';
        var blueSky = false;
        try {
          if (window.localStorage.getItem('mimia_theme') === 'light') theme = 'light';
          blueSky = window.localStorage.getItem('mimia_style') === 'blue-sky';
        } catch (e) {}
        if (blueSky) {
          document.documentElement.setAttribute('data-da', 'blue-sky');
          theme = 'dark';
        }
        document.documentElement.setAttribute('data-theme', theme);
      })();
    </script>
    <meta charset="utf-8" />
    <!-- Le .ico reste en premier pour les vieux navigateurs et la barre de
         favoris de Windows, qui l'exigent encore. Les PNG suivent : plus nets,
         et ils gardent la transparence. -->
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="%PUBLIC_URL%/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="%PUBLIC_URL%/favicon-16.png" />
    <!-- CE QUE GOOGLE DEMANDE VRAIMENT, vérifié dans sa documentation le
         06/09/2026 : une image CARRÉE d'au moins 8 px, dans un format courant,
         à une adresse STABLE et crawlable. Il recommande au-delà de 48 px pour
         que l'icône tienne sur ses différentes surfaces — d'où les tailles
         ci-dessous.

         LA TRANSPARENCE EST CONSERVÉE : les coins de `icon_c.png` sont
         détourés, et Google ne l'interdit pas — voir plus bas pour la seule
         exception, l'apple-touch-icon.

         LA SOURCE EST PETITE : 318 × 320, alors que `logo512.png` en fait
         512. Un agrandissement, pas une perte de netteté visible sur un
         dessin plat sans dégradé fin — mais si un jour la source se trouve
         en plus grand, la reprendre fera un meilleur `logo512.png`.

         Ces fichiers se régénèrent tous depuis `src/assets/icon_c.png` : ne
         pas en retoucher un seul à la main, ils doivent rester identiques
         entre eux. Leurs NOMS ne changent pas non plus — l'adresse devant
         rester stable, la renommer ferait perdre à Google la trace de l'icône
         déjà indexée.

         En dessous de 32 px, c'est la silhouette du livre — pas ses détails —
         qui porte la reconnaissance : le dessin reste trop chargé pour 16 px. -->
    <link rel="icon" type="image/png" sizes="48x48" href="%PUBLIC_URL%/icone-48.png" />
    <link rel="icon" type="image/png" sizes="96x96" href="%PUBLIC_URL%/icone-96.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="%PUBLIC_URL%/icone-192.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#12304A" />
    <meta
      name="description"
      content="Mimia — un professeur particulier par IA pour chacun de vos enfants, du CP à la Terminale. Il ne donne pas la réponse : il diagnostique ce qui bloque et reprend depuis là."
    />
    <!-- CETTE ICÔNE EST TOUJOURS GÉNÉRÉE SUR FOND BLANC FORCÉ, quelle que soit
         la source : iOS compose du NOIR derrière la transparence d'un
         apple-touch-icon, et un logo détouré y sortirait sur fond noir sur
         l'écran d'accueil. Avec `icon_4.png`, qui n'a pas de transparence,
         cette précaution ne change rien au résultat — mais elle doit rester,
         pour la prochaine source qui, elle, en aura. -->
    <link rel="apple-touch-icon" sizes="180x180" href="%PUBLIC_URL%/apple-touch-icon.png" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <link rel="canonical" href="https://mimia.fr/" />

    <!-- APERÇU DE PARTAGE
         Les adresses sont écrites en absolu, jamais avec %PUBLIC_URL% : les
         robots de Facebook, WhatsApp, LinkedIn, iMessage et Slack lisent le HTML
         brut sans exécuter de JavaScript, et rejettent un chemin relatif.
         L'image fait 1200 × 630 (le ratio 1.91:1 attendu) et pèse 250 Ko, sous
         la limite au-delà de laquelle WhatsApp n'affiche plus qu'un lien nu. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Mimia" />
    <meta property="og:locale" content="fr_FR" />
    <meta property="og:url" content="https://mimia.fr/" />
    <meta property="og:title" content="Mimia — le professeur particulier de vos enfants" />
    <meta
      property="og:description"
      content="Un professeur par IA avec un prénom, un visage, une voix — et une mémoire qui suit votre enfant d'année en année. Il ne donne jamais la réponse : il cherche où ça bloque."
    />
    <meta property="og:image" content="https://mimia.fr/apercu.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Nora, professeure de mathématiques, explique une fraction à Emma et l'écrit au tableau."
    />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Mimia — le professeur particulier de vos enfants" />
    <meta
      name="twitter:description"
      content="Un professeur par IA avec un prénom, un visage, une voix — et une mémoire qui suit votre enfant d'année en année. Il ne donne jamais la réponse : il cherche où ça bloque."
    />
    <meta name="twitter:image" content="https://mimia.fr/apercu.png" />

    <!-- Ce qui donne à Google le logo de la marque, distinct de l'icône des
         résultats : il alimente le panneau de connaissance. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "Mimia",
        "url": "https://mimia.fr/",
        "logo": "https://mimia.fr/logo512.png",
        "description": "Cours particuliers par intelligence artificielle pour les élèves du CP à la Terminale."
      }
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600&family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Lilita+One&family=Outfit:wght@300;400;500;600&display=swap"
      rel="stylesheet"
    />

    <title>Mimia — le professeur particulier de vos enfants</title>
  </head>
  <body>
    <noscript>Vous devez activer JavaScript pour utiliser Mimia.</noscript>
    <div id="root"></div>
  </body>
</html>
